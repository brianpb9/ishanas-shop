<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ishana's Shop 🍦</title>
    <!-- Self-contained: works by double-clicking OR via the server. The game
         (IshanaShop.jsx) is inlined below and compiled with Babel's classic
         JSX runtime. Rebuild with build.ps1 after editing IshanaShop.jsx. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Cute rounded display font (kid-friendly) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      html, body { overflow: hidden; position: fixed; width: 100%; overscroll-behavior: none; touch-action: manipulation; }
      body { -webkit-tap-highlight-color: transparent; font-family: 'Baloo 2', ui-rounded, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/plain" id="game-source">
/*__GAME_SOURCE__*/
    </script>
    <script>
      (function () {
        var root = document.getElementById("root");
        function fail(e){ root.innerHTML = '<pre style="padding:16px;color:#b00;white-space:pre-wrap;font:13px monospace">'+String(e&&e.stack?e.stack:e)+'</pre>'; console.error(e); }
        try {
          if (!window.Babel) throw new Error("Could not load Babel (no internet?). Connect to the internet once to load React/Tailwind/Babel from the CDN.");
          var src = document.getElementById("game-source").textContent;
          var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
          new Function(out)();
        } catch (e) { fail(e); }
      })();
    </script>
  </body>
</html>
